name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-and-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test

  bundle-and-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: verify bundle outputs
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/adapters/memory/index.js
          test -f dist/adapters/fs/index.js
          test -f dist/adapters/sqlite/index.js
          test -f dist/adapters/bun-sqlite/index.js
          test -f dist/adapters/cloudflare-kv/index.js
          test -f dist/adapters/indexeddb/index.js
          test -f dist/adapters/localstorage/index.js
          test -f dist/adapters/valkey-cluster/index.js
          test -f dist/adapters/s3/index.js
          test -f dist/adapters/leveldb/index.js
          test -f dist/codecs/compression.js
          test -f dist/codecs/encryption.js
          test -f dist/plugins/rate-limiter/index.js
          test -f dist/middleware/lock.js
          test -f dist/integrations/express/index.js
          test -f dist/integrations/hono/index.js
          test -f dist/testing/index.js
          test -f dist/cli/index.js

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: run core throughput benchmarks
        run: npx vitest bench --run
